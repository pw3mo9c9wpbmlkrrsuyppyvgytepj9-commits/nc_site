<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaCore DB Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-soft: #1f2630;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --accent-soft: #1f6feb;
      --danger: #f85149;
      --ok: #3fb950;
      --border: #30363d;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      margin-bottom: 14px;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 360px;
      gap: 14px;
      min-height: calc(100vh - 96px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .stack {
      display: grid;
      gap: 10px;
    }
    input,
    select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f141a;
      color: var(--text);
    }
    button {
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent-soft);
      border-color: #2f61c5;
    }
    button.danger {
      background: #3a1d21;
      border-color: #5f2d33;
    }
    .collections {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 65vh;
      overflow: auto;
    }
    .collection-item {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      padding: 10px;
      color: var(--text);
    }
    .collection-item.active {
      background: #1b2638;
      border-left: 3px solid var(--accent);
    }
    .doc-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .docs {
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 72vh;
      overflow: auto;
    }
    .doc-item {
      padding: 10px;
      border: 1px solid var(--border);
      border-left: 0;
      border-right: 0;
      border-top: 0;
      background: transparent;
      cursor: pointer;
    }
    .doc-item:hover {
      background: #161f2d;
    }
    .doc-item.active {
      background: #1b2638;
    }
    .doc-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #b7c4df;
      margin-bottom: 4px;
    }
    .doc-preview {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .field-list {
      display: grid;
      gap: 8px;
      max-height: 52vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #0f141a;
    }
    .pill {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      background: #1d2a3c;
      color: #b7c4df;
      font-size: 11px;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .status.ok {
      border-color: #285a38;
      color: #9be9a8;
    }
    .status.error {
      border-color: #6b2f36;
      color: #ffb4b4;
    }
    .empty {
      color: var(--muted);
      font-size: 12px;
      padding: 14px;
      text-align: center;
    }
    .split {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 220px 1fr;
      }
      .panel.editor {
        grid-column: 1 / -1;
      }
    }
    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
    .mini {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="brand">NexaCore Database Console</div>
      <div class="muted">Mongo-style collection and document explorer</div>
    </div>
    <div style="display:grid; grid-template-columns: 180px 180px; gap:8px;">
      <input id="apiKeyInput" placeholder="API key" />
      <input id="containerInput" placeholder="container" value="default" />
    </div>
  </div>

  <main class="layout">
    <aside class="panel">
      <h2>Collections</h2>
      <div class="stack">
        <input id="newCollectionInput" placeholder="new_collection" />
        <div class="split">
          <button id="createCollectionBtn" class="primary">Create</button>
          <button id="refreshCollectionsBtn">Refresh</button>
        </div>
        <button id="dropCollectionBtn" class="danger">Drop Selected</button>
      </div>
      <div id="collectionsList" class="collections"></div>
    </aside>

    <section class="panel">
      <div class="split">
        <h2 style="margin: 0;">Documents</h2>
        <span id="docsMeta" class="mini">No collection selected</span>
      </div>
      <div class="doc-toolbar">
        <button id="newDocBtn" class="primary">New Document</button>
        <button id="reloadDocsBtn">Reload</button>
      </div>
      <div id="documentsList" class="docs"></div>
    </section>

    <section class="panel editor">
      <div class="split">
        <h2 style="margin: 0;">Document Editor</h2>
        <span id="selectedDocBadge" class="pill">No document selected</span>
      </div>
      <div style="margin: 10px 0;" class="split">
        <button id="addFieldBtn">Add Field</button>
        <div>
          <button id="saveDocBtn" class="primary">Save</button>
          <button id="deleteDocBtn" class="danger">Delete</button>
        </div>
      </div>
      <div id="fieldList" class="field-list"></div>
      <div id="status" class="status">Ready.</div>
    </section>
  </main>

  <script>
    const API_BASE = "/api/public-db";
    const state = {
      collections: [],
      activeCollection: "",
      docs: [],
      selectedDocId: "",
      isNewDoc: false,
      apiKey: "",
      container: "default",
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(msg, type) {
      const el = $("status");
      el.textContent = msg;
      el.className = "status" + (type ? " " + type : "");
    }

    async function api(path, options) {
      const key = (state.apiKey || "").trim();
      const container = (state.container || "default").trim();
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(key ? { Authorization: `Bearer ${key}` } : {}),
          ...(container ? { "x-db-container": container } : {}),
          ...(options && options.headers ? options.headers : {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || "request_failed");
      }
      return data;
    }

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[m]));
    }

    function renderCollections() {
      const el = $("collectionsList");
      if (!state.collections.length) {
        el.innerHTML = '<div class="empty">No collections yet.</div>';
        return;
      }
      el.innerHTML = state.collections.map((name) => `
        <button class="collection-item ${state.activeCollection === name ? "active" : ""}" data-name="${esc(name)}">
          ${esc(name)}
        </button>
      `).join("");
      Array.from(el.querySelectorAll(".collection-item")).forEach((btn) => {
        btn.addEventListener("click", async () => {
          state.activeCollection = btn.dataset.name || "";
          state.selectedDocId = "";
          state.isNewDoc = false;
          await loadDocs();
          renderCollections();
        });
      });
    }

    function docPreview(doc) {
      const entries = Object.entries(doc.data || {});
      return entries.slice(0, 3).map(([k, v]) => `${k}: ${String(v)}`).join(" | ") || "(empty)";
    }

    function renderDocs() {
      const el = $("documentsList");
      $("docsMeta").textContent = state.activeCollection
        ? `${state.docs.length} document(s) in ${state.activeCollection}`
        : "No collection selected";
      if (!state.activeCollection) {
        el.innerHTML = '<div class="empty">Select a collection to view documents.</div>';
        return;
      }
      if (!state.docs.length) {
        el.innerHTML = '<div class="empty">No documents yet.</div>';
        return;
      }
      el.innerHTML = state.docs.map((doc) => `
        <div class="doc-item ${state.selectedDocId === doc.id ? "active" : ""}" data-id="${esc(doc.id)}">
          <div class="doc-id">${esc(doc.id)}</div>
          <div class="doc-preview">${esc(docPreview(doc))}</div>
        </div>
      `).join("");
      Array.from(el.querySelectorAll(".doc-item")).forEach((item) => {
        item.addEventListener("click", () => {
          const id = item.dataset.id || "";
          state.selectedDocId = id;
          state.isNewDoc = false;
          const doc = state.docs.find((d) => d.id === id);
          renderEditor(doc ? doc.data : {});
          renderDocs();
        });
      });
    }

    function createFieldRow(key = "", value = "") {
      const row = document.createElement("div");
      row.className = "field-row";
      row.innerHTML = `
        <input class="field-key" placeholder="field" value="${esc(key)}" />
        <input class="field-value" placeholder="value" value="${esc(value)}" />
        <button type="button" class="danger remove-field">X</button>
      `;
      row.querySelector(".remove-field").addEventListener("click", () => row.remove());
      return row;
    }

    function renderEditor(data) {
      const fieldList = $("fieldList");
      fieldList.innerHTML = "";
      const entries = Object.entries(data || {});
      if (!entries.length) {
        fieldList.appendChild(createFieldRow("", ""));
      } else {
        for (const [k, v] of entries) {
          fieldList.appendChild(createFieldRow(k, String(v)));
        }
      }
      $("selectedDocBadge").textContent = state.isNewDoc
        ? "New document"
        : (state.selectedDocId || "No document selected");
    }

    function collectEditorData() {
      const rows = Array.from(document.querySelectorAll("#fieldList .field-row"));
      const doc = {};
      for (const row of rows) {
        const key = row.querySelector(".field-key").value.trim();
        const value = row.querySelector(".field-value").value;
        if (!key) {
          continue;
        }
        doc[key] = value;
      }
      return doc;
    }

    async function loadCollections() {
      const data = await api(withContainerPath("/"));
      state.collections = data.collections || [];
      if (state.activeCollection && !state.collections.includes(state.activeCollection)) {
        state.activeCollection = "";
      }
      renderCollections();
    }

    async function loadDocs() {
      if (!state.activeCollection) {
        state.docs = [];
        renderDocs();
        renderEditor({});
        return;
      }
      const data = await api(withContainerPath("/" + encodeURIComponent(state.activeCollection)));
      state.docs = data.rows || [];
      if (state.selectedDocId && !state.docs.some((d) => d.id === state.selectedDocId)) {
        state.selectedDocId = "";
      }
      renderDocs();
      if (!state.selectedDocId && !state.isNewDoc) {
        renderEditor({});
      }
    }

    async function createCollection() {
      const name = $("newCollectionInput").value.trim();
      if (!name) {
        setStatus("Enter a collection name.", "error");
        return;
      }
      await api(withContainerPath("/_collections/" + encodeURIComponent(name)), { method: "POST" });
      state.activeCollection = name;
      $("newCollectionInput").value = "";
      await loadCollections();
      await loadDocs();
      setStatus(`Collection "${name}" is ready.`, "ok");
    }

    async function dropCollection() {
      if (!state.activeCollection) {
        setStatus("Select a collection first.", "error");
        return;
      }
      const name = state.activeCollection;
      if (!window.confirm(`Drop collection "${name}"? This removes all documents.`)) {
        return;
      }
      await api(withContainerPath("/_collections/" + encodeURIComponent(name)), { method: "DELETE" });
      state.activeCollection = "";
      state.selectedDocId = "";
      state.docs = [];
      renderEditor({});
      await loadCollections();
      renderDocs();
      setStatus(`Dropped "${name}".`, "ok");
    }

    function newDocument() {
      if (!state.activeCollection) {
        setStatus("Select a collection first.", "error");
        return;
      }
      state.selectedDocId = "";
      state.isNewDoc = true;
      renderDocs();
      renderEditor({});
      setStatus("New document mode.", "ok");
    }

    async function saveDocument() {
      if (!state.activeCollection) {
        setStatus("Select a collection first.", "error");
        return;
      }
      const payload = collectEditorData();
      if (state.isNewDoc || !state.selectedDocId) {
        const data = await api(withContainerPath("/" + encodeURIComponent(state.activeCollection)), {
          method: "POST",
          body: JSON.stringify(payload),
        });
        state.selectedDocId = data.row.id;
        state.isNewDoc = false;
        await loadDocs();
        renderEditor(data.row.data || {});
        setStatus("Document created.", "ok");
        return;
      }
      const data = await api(
        withContainerPath(
          "/" + encodeURIComponent(state.activeCollection) + "/" + encodeURIComponent(state.selectedDocId)
        ),
        {
          method: "PATCH",
          body: JSON.stringify(payload),
        }
      );
      await loadDocs();
      renderEditor(data.row.data || {});
      setStatus("Document updated.", "ok");
    }

    async function deleteDocument() {
      if (!state.activeCollection || !state.selectedDocId || state.isNewDoc) {
        setStatus("Select an existing document first.", "error");
        return;
      }
      if (!window.confirm("Delete selected document?")) {
        return;
      }
      await api(
        withContainerPath(
          "/" + encodeURIComponent(state.activeCollection) + "/" + encodeURIComponent(state.selectedDocId)
        ),
        { method: "DELETE" }
      );
      state.selectedDocId = "";
      state.isNewDoc = false;
      await loadDocs();
      renderEditor({});
      setStatus("Document deleted.", "ok");
    }

    $("createCollectionBtn").addEventListener("click", async () => {
      try { await createCollection(); } catch (e) { setStatus(e.message, "error"); }
    });
    $("refreshCollectionsBtn").addEventListener("click", async () => {
      try { await loadCollections(); setStatus("Collections refreshed.", "ok"); } catch (e) { setStatus(e.message, "error"); }
    });
    $("dropCollectionBtn").addEventListener("click", async () => {
      try { await dropCollection(); } catch (e) { setStatus(e.message, "error"); }
    });
    $("newDocBtn").addEventListener("click", newDocument);
    $("reloadDocsBtn").addEventListener("click", async () => {
      try { await loadDocs(); setStatus("Documents reloaded.", "ok"); } catch (e) { setStatus(e.message, "error"); }
    });
    $("addFieldBtn").addEventListener("click", () => {
      $("fieldList").appendChild(createFieldRow("", ""));
    });
    $("saveDocBtn").addEventListener("click", async () => {
      try { await saveDocument(); } catch (e) { setStatus(e.message, "error"); }
    });
    $("deleteDocBtn").addEventListener("click", async () => {
      try { await deleteDocument(); } catch (e) { setStatus(e.message, "error"); }
    });
    $("apiKeyInput").addEventListener("change", async (e) => {
      state.apiKey = String(e.target.value || "").trim();
      window.localStorage.setItem("dbConsoleApiKey", state.apiKey);
      state.activeCollection = "";
      state.selectedDocId = "";
      try { await loadCollections(); renderDocs(); renderEditor({}); setStatus("Auth key updated.", "ok"); } catch (err) { setStatus(err.message, "error"); }
    });
    $("containerInput").addEventListener("change", async (e) => {
      state.container = String(e.target.value || "default").trim() || "default";
      window.localStorage.setItem("dbConsoleContainer", state.container);
      state.activeCollection = "";
      state.selectedDocId = "";
      try { await loadCollections(); renderDocs(); renderEditor({}); setStatus("Container switched.", "ok"); } catch (err) { setStatus(err.message, "error"); }
    });

    function withContainerPath(path) {
      const container = (state.container || "default").trim() || "default";
      const connector = path.includes("?") ? "&" : "?";
      return `${path}${connector}container=${encodeURIComponent(container)}`;
    }

    (async function init() {
      try {
        state.apiKey = window.localStorage.getItem("dbConsoleApiKey") || "";
        state.container = window.localStorage.getItem("dbConsoleContainer") || "default";
        $("apiKeyInput").value = state.apiKey;
        $("containerInput").value = state.container;
        await loadCollections();
        renderDocs();
        renderEditor({});
        setStatus("Connected.", "ok");
      } catch (e) {
        setStatus("Failed to load: " + e.message, "error");
      }
    })();
  </script>
</body>
</html>
